name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CalculadoraNotas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalculadoraNotas-apk
          path: CalculadoraNotas.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest CalculadoraNotas.apk \
            --title "Calculadora de Notas (APK)" \
            --notes "APK gerado automaticamente a partir de ${{ github.sha }}." \
            --target ${{ github.sha }}
